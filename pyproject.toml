[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qqtg-bridge"
version = "1.1.0"
description = "QQ <-> Telegram group bridge: multi-group routing, media conversion, loop protection, web panel."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "websockets>=12",
    "httpx>=0.27",
    "aiosqlite>=0.19",
    "cryptography>=41",
    "qrcode>=7.4",
]

[project.scripts]
qqtg = "qqtg.cli:main"

[tool.setuptools.packages.find]
include = ["qqtg*"]

[tool.setuptools.package-data]
qqtg = ["web/static/*"]
